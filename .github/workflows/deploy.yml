name: Deploy Eskan Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            echo "🚀 Starting deployment..."

            cd /var/www/eskan-backend

            # Commit فعلی قبل از pull
            OLD_COMMIT=$(git rev-parse HEAD)

            echo "📥 Pulling latest code.. ....."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Commit جدید
            NEW_COMMIT=$(git rev-parse HEAD)

            echo "🔍 Checking dependency changes..."

            if git diff --name-only "$OLD_COMMIT" "$NEW_COMMIT" | grep -qE '^(package.json|package-lock.json)$'; then
              echo "📦 Dependencies changed. Running npm ci..."
              npm ci
            else
              echo "✅ Dependencies unchanged. Skipping npm ci."
            fi

            echo "🗄️ Applying database migrations..."
            npx prisma migrate deploy

            echo "🔧 Generating Prisma Client..."
            npx prisma generate

            echo "🌱 Running seed..."
            npm run prisma:seed

            echo "♻️ Restarting application..."
            pm2 restart eskan-backend-2

            echo "✅ Deployment completed successfully!"
